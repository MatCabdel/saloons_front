<!DOCTYPE html>
<html lang="en">
  <head>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1c35" />
    <style>
      html,
      body,
      app-root {
        background: radial-gradient(circle at 50% 43%, rgb(255 214 102 / 0.08), transparent 22%),
          linear-gradient(180deg, #2b1c35 0%, #5a3d6d 52%, #8f6aa4 100%);
      }
    </style>
    <link rel="icon" type="image/png" href="assets/icons/logo-SalOOns.png" />

      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Polyfills for SockJS/STOMP WebSocket -->
    <script>
      var global = window;
      window.global = window;
      if (typeof window.Buffer === 'undefined') {
        window.Buffer = {
          isBuffer: function () {
            return false;
          },
        };
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>

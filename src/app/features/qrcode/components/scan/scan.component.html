<!-- ✅ Équivalent de ngx-scanner-qrcode avec #action -->
<zxing-scanner 
  #action
  [(device)]="currentDevice"
  (camerasFound)="onCamerasFound($event)"
  (permissionResponse)="onPermissionResponse($event)"
  (scanSuccess)="onScanSuccess($event)"
  (scanError)="onScanError($event)"
  style="width: 100%">
</zxing-scanner>

<!-- ✅ Même loader qu'avant -->
<p class="loader" *ngIf="isLoading">Loading...</p>

<!-- ✅ Même bouton qu'avant 
<div class="btn-container">
  <button type="button" (click)="toggleScanner()">
    <img [src]="isStarted ? 'assets/icons/cameraOff.svg' : 'assets/icons/camera.svg'" alt="camera" />
  </button>
</div> -->

<!-- ✅ Même section résultat -->
@if (scannedUrl) {
  <div class="scanned-link">
    <button type="button" (click)="openScannedUrl()">Entrez dans le saloon</button>
  </div>
}

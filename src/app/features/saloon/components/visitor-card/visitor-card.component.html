<div class="visitor-card-container">
  <div class="img-card">
    <img [src]="user.imgUrl" [alt]="user.userName" />
    <div class="title-img">
      <h1>{{ user.userName }}</h1>
      <p><img class="icon-visitors" src="assets/icons/location.svg" alt="icons visitors" />{{ user.city }}Cenon</p>
      <p><img class="icon-visitors" src="assets/icons/visitors.svg" alt="icons visitors" />{{ user.age }} ans</p>
    </div>
  </div>
</div>

@if (isVisible && remainingSeconds > 0) {
  <div class="undo-toast">
    <div class="toast-content">
      <span class="toast-message">Tu as quitté le saloon</span>
      <button type="button" class="btn-undo" (click)="onUndo()">
        Annuler ({{ remainingSeconds }}s)
      </button>
    </div>
    <div class="progress-bar">
      <div class="progress" [style.width.%]="(remainingSeconds / 30) * 100"></div>
    </div>
  </div>
}

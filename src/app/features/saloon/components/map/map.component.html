<div class="map-container">
  <div id="map" class="map-element"></div>

  <!-- Bouton recentrer sur ma position -->
  <button type="button" class="center-btn" (click)="centerOnUser()" title="Me localiser">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v4"></path>
      <path d="M12 18v4"></path>
      <path d="M2 12h4"></path>
      <path d="M18 12h4"></path>
    </svg>
  </button>
</div>

<!-- Modal Saloon -->
@if (showModal && selectedSaloon) {
<app-saloon-modal
  [saloon]="selectedSaloon"
  [userLat]="userLat"
  [userLng]="userLng"
  (closed)="closeModal()"
>
</app-saloon-modal>
}

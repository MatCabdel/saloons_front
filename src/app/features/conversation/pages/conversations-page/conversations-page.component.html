<div class="messages-container">
  <div class="header-messages">
    <app-header></app-header>
    <h1>New winks</h1>
    <app-list-match [excludeUserIds]="conversationUserIds"></app-list-match>
  </div>
  <app-list-conversation (conversationUserIdsChange)="updateConversationUserIds($event)"></app-list-conversation>
  @if (monSaloonId !== undefined) {
    <app-enter-saloon [saloonId]="monSaloonId"></app-enter-saloon>
  }
  <app-navbar></app-navbar>
</div>

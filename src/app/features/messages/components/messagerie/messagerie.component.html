<div class="message-list" #messagesList>
  @for (msg of messages; track $index) {
    <div class="message-row" [ngClass]="{ me: msg.sender === myId, other: msg.sender !== myId }">
      @if (msg.sender !== myId) {
        <img [src]="getParticipantById(msg.sender)?.imgUrl || 'assets/img/default-avatar.png'" alt="avatar" />
      }
      <div class="bubble">
        <span class="name">
          @if (msg.sender === myId) {
            Moi
          } @else {
            {{ getParticipantById(msg.sender)?.userName || 'Inconnu' }}
          }
        </span>
        <span class="content">{{ msg.content }}</span>
      </div>
    </div>
  }
</div>
<div class="send-box">
  <textarea [(ngModel)]="newMessage" placeholder="Ecrire un message..."
    (keydown)="onEnterPress($event)"
    #messageInput
    rows="1"
    maxlength="1000"></textarea>
  <button type="button" (click)="sendMessage()" [disabled]="!newMessage.trim()">Envoyer</button>
</div>

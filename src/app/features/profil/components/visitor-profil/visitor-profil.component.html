<div class="visitor-profil-container">
  @if (data$ | async; as data) {
    <div class="profile-card">
      <div class="img-section">
        <img [src]="data.user.imgUrl" alt="profil" />
        <button class="back-button" type="button" (click)="goBack()" aria-label="Retour">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
      </div>
      <div class="info-section">
        <div class="header-row">
          <h1>{{ data.user.userName }}, {{ data.user.age }}</h1>
          <span class="city-tag">{{ data.user.city }}</span>
        </div>
        <div class="about-section">
          <h2>À propos</h2>
          <p>{{ data.user.description || 'Aucune description.' }}</p>
        </div>
        @if (data.user.id !== myId) {
          <button 
            class="action-button" 
            [class.wink]="!winkSent" 
            [class.wink-sent]="winkSent" 
            type="button" 
            (click)="wink()"
            [disabled]="winkSent">
            {{ winkSent ? 'Clin d\'œil envoyé !' : 'Envoyer un clin d\'œil' }}
          </button>
        }
      </div>
    </div>
  }
</div>

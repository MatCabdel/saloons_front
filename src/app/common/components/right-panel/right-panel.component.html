@if (isOpen$ | async) {
  <div
    class="right-panel-overlay"
    role="button"
    tabindex="0"
    (click)="onOverlayClick()"
    (keydown.enter)="onOverlayKey($event)"
    (keydown.space)="onOverlayKey($event)"
  >
    <aside class="right-panel" tabindex="0" (click)="stopPropagation($event)" (keydown.enter)="stopPropagation($event)" (keydown.space)="stopPropagation($event)">
      <button class="close-button" type="button" (click)="close()" aria-label="Fermer le panneau">✕</button>
      <div class="panel-content">
        <h2>Menu</h2>
        <p>Fonctionnalités supplémentaires à venir.</p>
        <button class="logout-button" type="button" (click)="onLogout()">Se déconnecter</button>
      </div>
    </aside>
  </div>
}

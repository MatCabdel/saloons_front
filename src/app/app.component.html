<div class="app-shell">
  <router-outlet></router-outlet>

  @if (apiStatus() !== 'ok') {
  <div class="startup-overlay" role="alert" aria-live="polite">
    <div class="startup-card">
      @if (apiStatus() === 'checking') {
      <div class="startup-icon spinner"></div>
      <h2>Connexion en cours</h2>
      <p>Nous vérifions l'accès aux serveurs Saloons.</p>
      } @else {
      <div class="startup-icon warning">!</div>
      <h2>Impossible de charger l'application</h2>
      <p>Vérifie ta connexion internet puis réessaie.</p>
      <button type="button" class="retry-btn" (click)="retryApi()">Réessayer</button>
      }
    </div>
  </div>
  }
</div>
